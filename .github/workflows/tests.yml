# Runs the offline unit tests. No secrets, no network-dependent steps.
name: tests

on:
  push:
  pull_request:

# Least privilege: the tests only read the repository.
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "3.x" (latest Python) is a deliberate early warning: with -W error it
        # fails on a new deprecation warning before 3.11 users notice anything.
        python-version: ["3.11", "3.x"]
    steps:
      # Actions are pinned by commit SHA (tag in the comment) so a moved tag
      # cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # the job never pushes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the unit tests
        run: python3 -W error -m unittest discover -s lab/tests
